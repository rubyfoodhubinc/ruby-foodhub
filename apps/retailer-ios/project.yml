name: RubyFoodHubRetailer
options:
  bundleIdPrefix: com.rubyfoodhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R7A65YU39K
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  RubyFoodHubRetailer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Ruby FoodHub Wholesale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSHumanReadableCopyright: "© 2026 RUBYNAV INC. This app is a product of RUBYNAV INC."
        NSCameraUsageDescription: Ruby FoodHub Wholesale uses your camera so you can take a photo of your company logo for your retailer profile.
        NSPhotoLibraryUsageDescription: Ruby FoodHub Wholesale accesses your photo library so you can choose an existing photo to use as your company logo.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LogoMarkSmall
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubyfoodhub.retailer
        PRODUCT_NAME: RubyFoodHubRetailer
        INFOPLIST_KEY_CFBundleDisplayName: Ruby FoodHub Wholesale
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  RubyFoodHubRetailerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RubyFoodHubRetailer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubyfoodhub.retailer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RubyFoodHubRetailer.app/RubyFoodHubRetailer
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  RubyFoodHubRetailer:
    build:
      targets:
        RubyFoodHubRetailer: all
        RubyFoodHubRetailerTests: [test]
    test:
      targets:
        - RubyFoodHubRetailerTests
    run:
      config: Debug
